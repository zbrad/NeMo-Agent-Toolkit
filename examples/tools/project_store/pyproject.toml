[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8", "setuptools_dynamic_dependencies>=1.0.0"]

[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../../.."

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nat_project_store"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11,<3.15"
description = "zbrad-local: save-a-markdown-note-to-local-disk tool for NAT chat sessions"
keywords = ["ai", "agents"]
classifiers = ["Programming Language :: Python"]

[tool.setuptools_dynamic_dependencies]
dependencies = [
  # Deliberately no "== {version}" exact-pin here (unlike the real
  # workspace members) -- this package isn't part of the uv workspace's
  # lockstep release versioning, it just needs whatever nvidia-nat-core
  # is already installed in the venv, matching this repo's broader
  # pip/.venv floor-version approach over exact pins.
  "nvidia-nat-core",
]

[tool.uv.sources]
nvidia-nat-core = { path = "../../../packages/nvidia_nat_core", editable = true }

[project.entry-points.'nat.components']
nat_project_store = "nat_project_store.register"

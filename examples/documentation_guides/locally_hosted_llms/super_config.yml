#
# Test config: points NAT's react_agent at the locally-running llama-server
# instance (Nemotron-3-Super via tuned/nemo.sh, port 8080, OpenAI-compatible
# API), to confirm a real tool call round-trips through it.

functions:
  current_datetime:
    _type: current_datetime

llms:
  super_llm:
    _type: openai
    api_key: "EMPTY"
    base_url: "http://127.0.0.1:8080/v1"
    model_name: nemotron-3-super

workflow:
  _type: react_agent
  tool_names: [current_datetime]
  llm_name: super_llm
  verbose: true
  parse_agent_response_max_retries: 3
